<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#080c14" />
    </radialGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Outer Sound Pulse Wave -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(99,102,241,0.18)" stroke-width="6" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(45,212,191,0.22)" stroke-width="4" />

  <!-- Center Sound Crystal / Tuning Core -->
  <g filter="url(#glow)">
    <!-- Stylized tuning fork / ear node -->
    <path d="M196 140 C196 210, 226 250, 256 270 C286 250, 316 210, 316 140" fill="none" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" />
    <line x1="256" y1="270" x2="256" y2="372" stroke="url(#primaryGrad)" stroke-width="28" stroke-linecap="round" />
    <circle cx="256" cy="372" r="22" fill="url(#accentGrad)" />
  </g>

  <!-- Golden Tonal Harmonic Dots (Scale degrees 1, 3, 5) -->
  <circle cx="256" cy="116" r="14" fill="#6366f1" />
  <circle cx="170" cy="256" r="11" fill="#2dd4bf" />
  <circle cx="342" cy="256" r="11" fill="#2dd4bf" />
</svg>
